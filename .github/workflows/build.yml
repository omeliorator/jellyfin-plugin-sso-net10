name: Plugin build (net10 / Jellyfin 12.x)

# Replaces the archived upstream JPRM flow: builds OUR 4.1.1.0 artifact from a
# clean checkout, writes meta.json from build.yaml, pins the sha256 as an
# uploaded artifact, and enforces the DES-007 §10.5 gate checks.
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build artifact
        run: bash scripts/build.sh

      - name: Gate checks
        run: bash scripts/verify_artifact.sh

      - name: Upload artifact + sha256
        uses: actions/upload-artifact@v4
        with:
          name: sso-authentication
          if-no-files-found: error
          path: |
            dist/sso-authentication_*.zip
            dist/sso-authentication_*.zip.sha256
